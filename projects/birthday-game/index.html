<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>생일 긴급 미션</title>
  <style>

    :root {
      --cream: #fff8e7;
      --strawberry: #ff9fc9;
      --lavender: #b9a7ff;
      --mint: #8fe3cf;
      --lemon: #ffe783;
      --sky: #8fd8ff;
      --grape: #4e3d72;
      --arcade-black: #fff8e7;
      --screen-black: #fffdf8;
      --maze-blue: #2448ff;
      --maze-glow: #d8cdff;
      --pixel-yellow: #ffd84d;
      --pixel-pink: #ff78b5;
      --pixel-cyan: #55cfe8;
      --pixel-red: #ff7590;
      --text: #4e3d72;
      --muted: #75668e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Malgun Gothic", "Courier New", monospace;
      color: var(--text);
      background-color: var(--cream);
      background-image:
        radial-gradient(circle at 15% 15%, rgba(255,159,201,.7), transparent 25%),
        radial-gradient(circle at 85% 12%, rgba(143,216,255,.68), transparent 24%),
        radial-gradient(circle at 15% 85%, rgba(143,227,207,.65), transparent 25%),
        radial-gradient(circle at 85% 85%, rgba(185,167,255,.7), transparent 28%),
        linear-gradient(rgba(185,167,255,.16) 2px, transparent 2px),
        linear-gradient(90deg, rgba(185,167,255,.16) 2px, transparent 2px),
        linear-gradient(135deg, #fff8e7, #fff0f7 48%, #effcff);
      background-size: 42px 42px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(78,61,114,.025) 3px 4px);
      z-index: 10;
    }

    .maze-dots {
      position: fixed;
      inset: 20px;
      pointer-events: none;
      border: 4px solid var(--lavender);
      box-shadow: 0 0 14px rgba(185,167,255,.65), inset 0 0 14px rgba(143,227,207,.28);
      background-image: radial-gradient(circle, var(--strawberry) 0 3px, transparent 4px);
      background-size: 42px 42px;
      opacity: .46;
      z-index: 0;
    }

    .confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .confetti span {
      position: absolute;
      width: 8px;
      height: 8px;
      top: -30px;
      border-radius: 0;
      animation: coinFall linear infinite, coinBlink .7s steps(2) infinite;
      opacity: .85;
    }

    @keyframes fall {
      to { transform: translateY(115vh) rotate(720deg); }
    }

    @keyframes coinFall {
      to { transform: translateY(115vh) rotate(360deg); }
    }

    @keyframes coinBlink {
      50% { opacity: .3; }
    }

    .wrap {
      width: min(92vw, 720px);
      padding: 26px 0;
      position: relative;
      z-index: 1;
    }

    .game {
      position: relative;
      background: rgba(255,253,248,.96);
      border: 4px solid var(--maze-blue);
      box-shadow:
        0 0 0 5px var(--cream),
        0 0 0 9px var(--strawberry),
        0 0 0 13px var(--lemon),
        0 0 30px rgba(185,167,255,.72),
        12px 12px 0 rgba(78,61,114,.18);
      border-radius: 4px;
      padding: clamp(22px, 5vw, 42px);
      animation: rainbowFrame 4s steps(4) infinite;
    }

    @keyframes rainbowFrame {
      0% { border-color: var(--lavender); }
      25% { border-color: var(--strawberry); }
      50% { border-color: var(--mint); }
      75% { border-color: var(--sky); }
      100% { border-color: var(--lavender); }
    }

    .game::before,
    .game::after {
      content: "●  ·  ●  ·  ●  ·  ●";
      position: absolute;
      left: 18px;
      right: 18px;
      color: var(--strawberry);
      font-size: 10px;
      letter-spacing: 7px;
      overflow: hidden;
      white-space: nowrap;
    }

    .game::before { top: 8px; }
    .game::after { bottom: 8px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border: 2px solid var(--pixel-yellow);
      border-radius: 0;
      background: #fff4bf;
      color: var(--grape);
      font-weight: 800;
      letter-spacing: .03em;
      font-size: .88rem;
      text-transform: uppercase;
      box-shadow: 4px 4px 0 var(--lavender);
      animation: badgePulse 1.3s steps(2) infinite;
    }

    @keyframes badgePulse { 50% { color: #fff; border-color: var(--pixel-pink); } }

    h1 {
      margin: 18px 0 10px;
      font-size: clamp(2rem, 7vw, 4rem);
      line-height: 1.08;
      color: #ffbe32;
      text-shadow: 4px 4px 0 var(--strawberry), 8px 8px 0 #e4dcff;
      letter-spacing: .04em;
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.7;
      font-size: 1.02rem;
      margin-bottom: 24px;
      color: #69538c;
    }

    .status {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 22px 0 28px;
    }

    .stat {
      background: #fff1f7;
      border: 2px solid var(--strawberry);
      border-radius: 0;
      padding: 13px;
      text-align: center;
      box-shadow: 4px 4px 0 #eadfff;
    }

    .stat:nth-child(2) { background: #fff8cf; border-color: var(--lemon); }
    .stat:nth-child(3) { background: #e9fffa; border-color: var(--mint); }

    .stat:nth-child(1) b { color: var(--pixel-red); }
    .stat:nth-child(2) b { color: var(--pixel-yellow); }
    .stat:nth-child(3) b { color: var(--pixel-cyan); }
    .stat b { display: block; font-size: 1.05rem; margin-bottom: 6px; }
    .stat span { color: var(--muted); font-size: .82rem; }

    .story {
      background: linear-gradient(135deg, #fffaff, #f4fcff);
      border-radius: 0;
      padding: 22px;
      line-height: 1.85;
      min-height: 210px;
      white-space: pre-line;
      border: 3px solid var(--lavender);
      box-shadow: inset 0 0 0 3px #fff, 6px 6px 0 rgba(143,216,255,.55);
      color: var(--grape);
      text-shadow: 1px 1px 0 #fff;
    }

    .choices {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      appearance: none;
      border: 0;
      width: 100%;
      border-radius: 0;
      padding: 16px 18px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      transition: transform .08s steps(2), box-shadow .08s steps(2), background .08s steps(2);
    }

    .choice {
      background: #eafaff;
      color: var(--grape);
      text-align: left;
      border: 2px solid var(--pixel-cyan);
      box-shadow: 5px 5px 0 rgba(78,61,114,.2);
    }

    .choice:nth-child(2) { border-color: var(--strawberry); background: #fff0f7; }
    .choice:nth-child(3) { border-color: #e5bd32; background: #fff9d9; }
    .choice:hover { transform: translate(-2px, -2px); background: var(--lavender); box-shadow: 7px 7px 0 var(--strawberry); color: #fff; }
    .choice:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 var(--lavender); }

    .primary {
      margin-top: 18px;
      background: var(--pixel-yellow);
      color: var(--grape);
      border: 3px solid #fff;
      box-shadow: 6px 6px 0 var(--pixel-pink);
    }

    .secondary {
      margin-top: 10px;
      background: #effcff;
      color: var(--grape);
      border: 2px solid var(--pixel-cyan);
      box-shadow: 5px 5px 0 var(--lavender);
    }

    .ending {
      text-align: center;
    }

    .ending .emoji {
      font-size: 4.5rem;
      display: block;
      margin-bottom: 12px;
      image-rendering: pixelated;
      filter: drop-shadow(5px 5px 0 var(--strawberry));
      animation: coinBlink 1s steps(2) 3;
    }

    .ending h2 {
      font-size: clamp(1.8rem, 6vw, 3rem);
      margin: 10px 0;
    }

    .reward {
      margin: 20px 0;
      white-space: pre-line;
      padding: 18px;
      border-radius: 0;
      background: linear-gradient(135deg, #fff4fa, #effffc);
      color: var(--grape);
      border: 3px dashed var(--pixel-pink);
      box-shadow: 6px 6px 0 var(--lemon);
      line-height: 1.75;
    }

    .ending-gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 22px 0;
      padding: 10px;
      border: 3px solid var(--lavender);
      background: linear-gradient(135deg, #fff8cf, #fff0f7, #e9fffa);
      box-shadow: 6px 6px 0 var(--strawberry);
    }

    .ending-gallery.hidden { display: none; }

    .ending-gallery.three-column { grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .ending-photo {
      width: 100%;
      height: 210px;
      object-fit: cover;
      border: 3px solid #fff;
      outline: 2px solid var(--grape);
      image-rendering: auto;
      box-shadow: 4px 4px 0 rgba(78,61,114,.2);
    }

    .footer {
      text-align: center;
      color: var(--grape);
      font-size: .8rem;
      margin-top: 14px;
    }

    .hidden { display: none; }

    .pixel-corner {
      position: fixed;
      z-index: 2;
      font-size: clamp(2rem, 5vw, 3.5rem);
      filter: drop-shadow(4px 4px 0 #fff);
      animation: pixelBounce 1.1s steps(2) infinite;
      pointer-events: none;
    }

    .pixel-corner.rabbit { top: 42px; left: 46px; }
    .pixel-corner.lion { right: 46px; bottom: 42px; animation-delay: -.5s; }

    @keyframes pixelBounce { 50% { transform: translateY(-7px); } }

    .birthday-decor {
      position: fixed;
      z-index: 1;
      font-size: clamp(1.7rem, 4vw, 3rem);
      letter-spacing: .3em;
      pointer-events: none;
      filter: drop-shadow(3px 3px 0 rgba(78,61,114,.14));
      animation: partyFloat 2s steps(3) infinite;
    }

    .decor-left { left: 5%; bottom: 14%; transform: rotate(-8deg); }
    .decor-right { right: 4%; top: 14%; transform: rotate(8deg); animation-delay: -1s; }

    @keyframes partyFloat { 50% { translate: 0 -10px; } }

    .pixel-fireworks {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background-image:
        radial-gradient(circle at 9% 34%, var(--lemon) 0 4px, transparent 5px),
        radial-gradient(circle at 92% 28%, var(--strawberry) 0 5px, transparent 6px),
        radial-gradient(circle at 88% 72%, var(--mint) 0 4px, transparent 5px),
        radial-gradient(circle at 12% 72%, var(--sky) 0 5px, transparent 6px);
      animation: sparkle 1.5s steps(2) infinite;
    }

    @keyframes sparkle { 50% { opacity: .35; transform: scale(.99); } }

    @media (max-width: 520px) {
      .status { grid-template-columns: 1fr; }
      .game { border-width: 3px; }
      .story { min-height: 240px; }
      .maze-dots { inset: 8px; }
      .pixel-corner { opacity: .65; }
      .pixel-corner.rabbit { top: 14px; left: 16px; }
      .pixel-corner.lion { right: 16px; bottom: 14px; }
      .birthday-decor { opacity: .48; font-size: 1.5rem; }
      .ending-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .ending-gallery.three-column { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .ending-photo { height: clamp(130px, 38vw, 180px); }
    }
  </style>
</head>
<body>
  <div class="maze-dots"></div>
  <div class="pixel-fireworks"></div>
  <div class="birthday-decor decor-left">🎈 ✦ 🎁</div>
  <div class="birthday-decor decor-right">🎂 ★ 🎉</div>
  <div class="pixel-corner rabbit">🐰</div>
  <div class="pixel-corner lion">🦁</div>
  <div class="confetti" id="confetti"></div>

  <main class="wrap">
    <section class="game">
      <div id="intro">
        <span class="badge">🎮 BIRTHDAY QUEST</span>
        <h1><span id="friendNameTitle">친구</span>의<br>생일 퀘스트</h1>
        <p class="subtitle">선택에 따라 달라지는 세 가지 생일 이야기.<br>개인정보를 바꾼 공개용 예시입니다.</p>

        <div class="status">
          <div class="stat"><b>체력 12</b><span>적당한 운동이 필요한 듯 하다.</span></div>
          <div class="stat"><b>야무짐 999</b><span>야무딱진 토끼로 태어난걸 어떡해🤷‍♀️🐰</span></div>
          <div class="stat"><b>운전 MAX</b><span>모두가 인정하는 베스트 드라이버🚗</span></div>
        </div>

        <button class="primary" onclick="startGame()">생일 탈출 작전 시작하기</button>
      </div>

      <div id="gameArea" class="hidden">
        <span class="badge" id="chapterBadge">MISSION 1</span>
        <div class="story" id="story"></div>
        <div class="choices" id="choices"></div>
      </div>

      <div id="ending" class="hidden ending">
        <span class="emoji" id="endingEmoji">🎂</span>
        <span class="badge" id="endingBadge">ENDING</span>
        <h2 id="endingTitle">생일 축하해!🥳🎈🎉</h2>
        <div class="reward" id="endingText"></div>
        <div class="ending-gallery hidden" id="endingGallery"></div>
        <button class="primary" onclick="restartGame()">다른 엔딩 보기</button>
        <button class="secondary" onclick="shareResult()">결과 복사하기</button>
      </div>
    </section>
    <div class="footer">🦁 선택으로 완성하는 생일 이야기 🐰</div>
  </main>

  <script>
    // 여기만 친구 이름으로 바꾸세요.
    const FRIEND_NAME = "친구";

    const ENDING_IMAGES = {roadtrip: [], knitting: [], true: []};

    const state = {
      escape: null,
      preference: null,
      travel: null,
      ending: null
    };

    const storyEl = document.getElementById('story');
    const choicesEl = document.getElementById('choices');
    const chapterBadge = document.getElementById('chapterBadge');

    document.getElementById('friendNameTitle').textContent = FRIEND_NAME;
    document.title = `${FRIEND_NAME}의 생일 미니게임`;

    function startGame() {
      document.getElementById('intro').classList.add('hidden');
      document.getElementById('gameArea').classList.remove('hidden');
      showScene1();
    }

    function setScene(chapter, text, choices) {
      chapterBadge.textContent = chapter;
      storyEl.textContent = text;
      choicesEl.innerHTML = '';

      choices.forEach((choice, index) => {
        const btn = document.createElement('button');
        btn.className = 'choice';
        btn.textContent = `${index + 1}. ${choice.label}`;
        btn.onclick = choice.action;
        choicesEl.appendChild(btn);
      });
    }

    function showScene1() {
      setScene(
        'MISSION 1 · 작업실 탈출',
        `오늘은 친구의 생일입니다!\n\n작업실에 축제 초대장이 도착했습니다.\n\n파티를 시작하기 전에 첫 번째 선택을 해 주세요.`,
        [
          { label: '젤리를 먹고 체력을 충전한다🍭', action: () => chooseEscape('jelly') },
          { label: '뜨개질 실력으로 다져진 손재주로 문까지 고쳐버린다🧶', action: () => chooseEscape('knit') },
          { label: '“이 문, 생각보다 열기 쉬워 보이는데?”라며 정면 돌파한다👊', action: () => chooseEscape('pressure') }
        ]
      );
    }

    function chooseEscape(choice) {
      state.escape = choice;

      const scenes = {
        jelly: `주머니를 뒤졌지만… 젤리가 한 개도 없다.\n\n친구이(가) 출입문을 노려보던 순간... 출입문이 공포를 느끼고 스스로 열었다.`,
        knit: `친구은 뜨개바늘 두 개를 꺼내 '출입문'를 수리했다.\n\n작동 원리는 헷갈리지만 손재주가 좋으니 아무튼 성공이다.`,
        pressure: `생일자에게 개기면 안 된다는 판단에\n'출입문'이 최대한의 예우를 갖춰 문을 활짝 열었다.`
      };

      setScene(
        'MISSION 2 · 선물 고르기',
        scenes[choice] + `\n\n이제 생일 선물을 골라 볼 시간입니다. 간식, 이야기, 새로운 도전 중 무엇이 가장 마음에 드나요?`,
        [
          { label: '달콤한 간식을 선택한다', action: () => choosePreference('jelly') },
          { label: '재미있는 이야기를 선택한다', action: () => choosePreference('drama') },
          { label: '새로운 도전을 선택한다', action: () => choosePreference('professor') }
        ]
      );
    }

    function choosePreference(choice) {
      state.preference = choice;

      const interviews = {
        jelly: `선물을 골랐습니다!\n\n강아지 안내원이 다음 목적지로 안내합니다. 선택한 취향은 마지막 엔딩에 반영됩니다.`,
        drama: `선물을 골랐습니다!\n\n강아지 안내원이 다음 목적지로 안내합니다. 선택한 취향은 마지막 엔딩에 반영됩니다.`,
        professor: `선물을 골랐습니다!\n\n강아지 안내원이 다음 목적지로 안내합니다. 선택한 취향은 마지막 엔딩에 반영됩니다.`
      };

      setScene(
        'NEXT MISSION',
        interviews[choice] + `\n\n그 순간, 강아지가 어딘가에서 튀어나와 촬영장에 전속력으로 난입했다!\n\n🐩 강아지: “누나, 멍! 지금 여기서 연애 프로그램 찍을 때가 아니다, 멍!\n축제 광장에서 생일 파티가 기다리고 있다, 멍!”`,
        [{ label: '강아지🐩와 함께 축제 광장로 출발한다.', action: showTravelScene }]
      );
    }

    function showTravelScene() {
      setScene(
        'MISSION 3 · 축제 광장 귀환 작전',
        `목적지: 축제 광장\n출발지: 광장\n남은 체력: 2\n운전 실력: MAX\n\n강아지가 비장한 표정으로 비밀 지도를 꺼내 들었다.\n\n🐩 강아지: “하지만 축제 광장까지 가는 길에는 ‘예기치 않은 위험’이 기다리고 있다, 멍! 정신 단단히 차려야 한다, 멍!”`,
        [
          { label: '운전 실력 Lv.MAX로 축제 광장까지 질주한다.🚗', action: () => chooseTravel('drive') },
          { label: '강아지🐩의 수상한 내비게이션을 믿어본다.', action: () => chooseTravel('latte') },
          { label: '황금빛 갈기의 사자🦁를 소환한다.', action: () => chooseTravel('lion') }
        ]
      );
    }

    function chooseTravel(choice) {
      state.travel = choice;

      const travelScenes = {
        drive: `친구은 운전대를 잡는 순간 체력이 2밖에 남지 않았다는 사실을 잊었다.\n운전 실력 Lv.MAX의 토끼🐰에게 막히는 길이란 없었다.\n\n🐩 강아지: “역시 누나의 운전 실력은 믿을 만하다, 멍!”\n\n친구은 강아지를 태우고 능숙하게 축제 광장로 향했다.`,
        latte: `선택한 방식으로 다음 장소에 도착했습니다.\n\n친구들과 함께 생일 파티를 준비해 볼까요?`,
        lion: `친구의 도움을 받아 파티 장소로 이동했습니다.\n\n서로 도우니 도착하는 길도 즐겁습니다.`
      };

      setScene(
        'FINAL MISSION · 친구 강아지의 안내🐕',
        travelScenes[choice] + `\n\n드디어 파티 장소에 도착했습니다. 친구들이 준비한 선물이 문 너머에 있습니다. 문을 열어 결과를 확인해 주세요!`,
        [{ label: '문을 열어본다.', action: showEnding }]
      );
    }

    function getEndingType() {
      if (state.escape === 'knit' && state.preference === 'professor') {
        return 'knitting';
      }
      if (state.travel === 'drive') {
        return 'roadtrip';
      }
      return 'true';
    }

    function showEnding() {
      const type = getEndingType();
      const endings = {
        knitting: {
          emoji: '🧶👑🐰',
          badge: 'HIDDEN ENDING 1: CEO ENDING · 회사를 차리다.',
          title: 'CEO가 되었다.',
          text: `손재주와 새로운 도전을 선택한 당신!\n\n직접 만든 작은 선물이 모두에게 즐거움을 줬습니다.\n\n오늘의 엔딩: 나만의 공방을 열다.\n생일 축하합니다!`,
          images: ENDING_IMAGES.knitting
        },
        roadtrip: {
          emoji: '🚗🌊🐰',
          badge: 'HIDDEN ENDING 2: ROAD TRIP ENDING · 목적지는 달라졌지만 더 좋을 수도...?',
          title: '축제 광장를 지나 바닷가에 도착하다.',
          text: `직접 길을 선택한 당신!\n\n예정된 파티는 즐거운 바닷가 여행으로 바뀌었습니다.\n\n오늘의 엔딩: 뜻밖의 여행.\n생일 축하합니다!`,
          images: ENDING_IMAGES.roadtrip
        },
        true: {
          emoji: '🦁🎉🐰',
          badge: 'TRUE ENDING · 사자가 준비한 생일 작전',
          title: '생일 축하해, 친구',
          text: `문을 열자 친구들이 케이크를 들고 기다리고 있었습니다.\n\n함께 웃고 새로운 추억을 만드는 하루가 되기를 바랍니다.\n\n오늘의 엔딩: 모두 함께 생일 파티.\n생일 축하합니다!`,
          images: ENDING_IMAGES.true
        }
      };

      state.ending = endings[type];
      document.getElementById('gameArea').classList.add('hidden');
      document.getElementById('ending').classList.remove('hidden');
      document.getElementById('endingEmoji').textContent = state.ending.emoji;
      document.getElementById('endingBadge').textContent = state.ending.badge;
      document.getElementById('endingTitle').textContent = state.ending.title;
      document.getElementById('endingText').textContent = state.ending.text;
      const gallery = document.getElementById('endingGallery');
      gallery.innerHTML = '';
      gallery.classList.toggle('hidden', state.ending.images.length === 0);
      gallery.classList.toggle('three-column', state.ending.images.length === 3);
      state.ending.images.forEach((src, index) => {
        const img = document.createElement('img');
        img.className = 'ending-photo';
        img.src = src;
        img.alt = `${state.ending.title} 추억 사진 ${index + 1}`;
        gallery.appendChild(img);
      });
    }

    function restartGame() {
      state.escape = null;
      state.preference = null;
      state.travel = null;
      state.ending = null;
      document.getElementById('endingGallery').innerHTML = '';
      document.getElementById('ending').classList.add('hidden');
      document.getElementById('gameArea').classList.remove('hidden');
      showScene1();
    }

    async function shareResult() {
      const text = `[${FRIEND_NAME} 생일 미니게임 결과]\n${state.ending.badge} - ${state.ending.title}\n\n${state.ending.text}`;
      try {
        await navigator.clipboard.writeText(text);
        alert('결과가 복사되었습니다!');
      } catch {
        alert('복사에 실패했습니다. 화면을 캡처해 주세요!');
      }
    }

    function makeConfetti() {
      const colors = ['#ffd166', '#ff7aa2', '#8ee3c8', '#ffffff', '#9f8cff'];
      const holder = document.getElementById('confetti');
      for (let i = 0; i < 44; i++) {
        const piece = document.createElement('span');
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (5 + Math.random() * 8) + 's';
        piece.style.animationDelay = (-Math.random() * 12) + 's';
        piece.style.transform = `rotate(${Math.random() * 360}deg)`;
        holder.appendChild(piece);
      }
    }

    makeConfetti();
  </script>
</body>
</html>
